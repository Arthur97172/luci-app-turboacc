name: Build Package

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先跑仓库里的 Node 测试，再动用 SDK 编译，避免明显问题浪费十几分钟构建时间。
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suite
        run: node tests/run.js

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.10 使用 opkg（.ipk），25.12 使用 apk（.apk）。
          # 每个版本都在 x86/64 与 armsr/armv8 两种架构上各编译一次：
          # 本包是 LUCI_PKGARCH:=all，产物架构无关，双架构编译用于验证
          # Makefile 与依赖在两个目标上都能正常解析。
          - artifact: ipk-x86-64
            pkg_ext: ipk
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - artifact: ipk-armsr-armv8
            pkg_ext: ipk
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/armsr/armv8/openwrt-sdk-24.10.8-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - artifact: apk-x86-64
            pkg_ext: apk
            sdk_url: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - artifact: apk-armsr-armv8
            pkg_ext: apk
            sdk_url: https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv8/openwrt-sdk-25.12.6-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: package-dir

      - name: Download SDK
        run: |
          curl -fsSL --retry 10 --retry-delay 15 "${{ matrix.sdk_url }}" -o sdk.tar.zst

      - name: Extract SDK
        run: |
          tar -xf sdk.tar.zst
          mv openwrt-sdk-* sdk

      - name: Copy package to SDK
        run: |
          mkdir -p sdk/package/luci-app-turboacc
          cp -r package-dir/* sdk/package/luci-app-turboacc/
          # 测试与 CI 配置不需要进入编译目录，删掉可让构建更快、更干净。
          rm -rf sdk/package/luci-app-turboacc/tests \
                 sdk/package/luci-app-turboacc/.github \
                 sdk/package/luci-app-turboacc/.git

      - name: Install feeds
        run: |
          cd sdk
          sed -e 's/^src-git-full /src-git /' feeds.conf.default > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 显式选中中文：i18n 子包的 DEFAULT 是 LUCI_LANG_zh_Hans||(ALL&&m)。
          # SDK 自带 CONFIG_ALL=y，本就落到 m，这里显式置 y 以免依赖该默认值。
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          make defconfig

      - name: Build package
        run: |
          cd sdk
          # 只需目录级目标：luci.mk 的 LuciTranslation 在同一个 Makefile 里求值，
          # i18n 子包与该目录同属一个 builddir，会一并编译。
          # 注意不存在 package/luci-i18n-turboacc-zh-cn/compile 这个目标。
          make -j"$(nproc)" package/luci-app-turboacc/compile V=s

      - name: Verify package metadata
        run: |
          cd sdk
          case "${{ matrix.pkg_ext }}" in
            ipk)
              found=0
              for f in bin/packages/*/base/luci-app-turboacc_*.ipk; do
                [ -e "$f" ] || continue
                found=1
                f=$(realpath "$f")
                d=$(mktemp -d)
                ( cd "$d" && tar -xzf "$f" ./control.tar.gz \
                  && tar -xzf control.tar.gz ./control \
                  && grep -qx 'URL: https://github.com/Arthur97172/luci-app-turboacc' control \
                  && grep -qx 'Maintainer: Arthur97172 <Arthur97172@users.noreply.github.com>' control \
                  && grep -qx 'Architecture: all' control ) \
                  || { echo "wrong package metadata in $f"; exit 1; }
                rm -rf "$d"
              done
              [ "$found" = 1 ] || { echo "no ipk found"; exit 1; }
              ;;
            apk)
              APK=$(find staging_dir/host -type f -name apk -perm -u+x | head -1)
              found=0
              for f in bin/packages/*/base/luci-app-turboacc-*.apk; do
                [ -e "$f" ] || continue
                found=1
                "$APK" adbdump "$f" | grep -q 'url: https://github.com/Arthur97172/luci-app-turboacc' \
                  || { echo "wrong URL in $f"; exit 1; }
                "$APK" adbdump "$f" | grep -q 'maintainer: Arthur97172 <Arthur97172@users.noreply.github.com>' \
                  || { echo "wrong maintainer in $f"; exit 1; }
              done
              [ "$found" = 1 ] || { echo "no apk found"; exit 1; }
              ;;
          esac

      - name: Verify package contents
        run: |
          cd sdk
          # 主包必须带上视图、ucode 后端与 rpcd 插件；缺任何一个页面都打不开。
          for f in bin/packages/*/base/luci-app-turboacc_*.ipk; do
            [ -e "$f" ] || continue
            d=$(mktemp -d)
            ( cd "$d" && tar -xzf "$f" ./data.tar.gz && tar -xzf data.tar.gz ) \
              || { echo "cannot unpack $f"; exit 1; }
            test -f "$d/usr/share/ucode/turboacc/core.uc" || { echo "core.uc missing in $f"; exit 1; }
            test -f "$d/www/luci-static/resources/view/turboacc.js" || { echo "view missing in $f"; exit 1; }
            test -f "$d/usr/share/rpcd/ucode/luci.turboacc" || { echo "rpcd plugin missing in $f"; exit 1; }
            rm -rf "$d"
          done
          # apk 包的 data 段是追加的 gzip 流，tar 不能可靠遍历；翻译包与主包的存在性
          # 由下一步的产物收集统一校验。
          true

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          find sdk/bin/packages -type f -name "luci-*turboacc*.${{ matrix.pkg_ext }}" -exec cp {} artifacts/ \;
          # 不能用 test -s artifacts/*：多个产物时 glob 展开成多参数，test 会报 binary operator expected
          [ -n "$(ls -A artifacts 2>/dev/null)" ] || { echo "No artifact found!"; exit 1; }
          # 翻译包缺失说明 i18n 子包没被编译出来，直接失败以便尽早发现
          ls artifacts/ | grep -q "luci-i18n-turboacc" || { echo "i18n package missing!"; exit 1; }
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: ignore

  release:
    needs: build
    if: ${{ success() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version from Makefile
        id: version
        run: |
          VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | tr -d '[:space:]')
          REL=$(sed -n 's/^PKG_RELEASE:=//p' Makefile | tr -d '[:space:]')
          PKGVER="${VER}-r${REL}"
          echo "PKGVER=${PKGVER}" >> "$GITHUB_OUTPUT"
          echo "包版本：${PKGVER}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'ipk-*'
          merge-multiple: true

      - name: Download apk artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'apk-*'
          merge-multiple: true

      - name: Verify artifacts
        run: |
          mkdir -p artifacts
          missing=""
          compgen -G 'artifacts/*.ipk' >/dev/null || missing="$missing .ipk"
          compgen -G 'artifacts/*.apk' >/dev/null || missing="$missing .apk"
          if [ -n "$missing" ]; then
            echo "缺少构建产物：$missing；保留现有 Release，不发布不完整的版本"
            exit 1
          fi
          ls -lh artifacts/

      - name: Generate release body
        run: |
          missing=""
          {
            printf '自动编译的插件包（版本 %s）\n\n' "${{ steps.version.outputs.PKGVER }}"
            printf '适用系统：OpenWrt / ImmortalWrt 24.10（`.ipk`）与 25.12（`.apk`），需要 firewall4（nftables），不支持已淘汰的 firewall3。\n\n'
            if compgen -G 'artifacts/*.ipk' >/dev/null; then
              printf -- '- `.ipk`（opkg）— OpenWrt/ImmortalWrt 24.10 及更早\n'
            else
              missing="${missing:+$missing、}.ipk"
            fi
            if compgen -G 'artifacts/*.apk' >/dev/null; then
              printf -- '- `.apk`（apk）— OpenWrt/ImmortalWrt 25.12+\n'
            else
              missing="${missing:+$missing、}.apk"
            fi
            printf -- '- 架构无关（ipk 为 `all`，apk 为 `noarch`）：前端是纯 JavaScript 资源，同一份产物同时支持 ARM / x86 等平台；CI 已在 x86/64 与 armsr/armv8 上分别验证编译\n'
            printf -- '- `luci-i18n-turboacc-zh-cn`：中文翻译包，单独安装；不装则界面显示英文\n'
            if [ -n "$missing" ]; then
              printf '\n注意：本次构建缺少：%s（详见 Actions 构建日志）\n' "$missing"
            fi
          } > release_body.md
          cat release_body.md

      - name: Delete existing release/tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKGVER="${{ steps.version.outputs.PKGVER }}"
          gh release delete "$PKGVER" -y --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$PKGVER" 2>/dev/null || true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.PKGVER }}
          name: ${{ steps.version.outputs.PKGVER }}
          body_path: release_body.md
          files: artifacts/*
          token: ${{ github.token }}
          make_latest: true
